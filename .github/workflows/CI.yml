name: CI

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
        ruby-version:
          - "2.7"
          - "3.0"
          - "3.1"
          - "3.2"
          - "3.3"
          - "3.4"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Configure Git email/username
        run: |
          git config --global user.email "orta+dangersystems@artsy.net"
          git config --global user.name "Danger.Systems"

      - name: Linting
        run: bundle exec rubocop

      - name: Running Tests
        run: bundle exec rake spec

  danger:
    uses: numbata/danger-pr-comment/.github/workflows/danger-run.yml@58e325dd25ef3e26cdcd60c97e6ec7848a7d7fdf
    with:
      ruby-version: '3.4'
      bundler-cache: true
      danger-args: 'pr ${{ github.event.pull_request.html_url }} --fail-on-errors=true'
